name: Build dsc-bridge (all platforms)

# Builds the dsc-bridge Go binary for Linux, Windows (x64 + x86), and macOS
# (Intel + Apple Silicon, plus a universal fat binary). Triggered on:
#   - push to main / dsc_bridge branches
#   - tag push (v*) — also creates a Release with binaries attached
#   - manual dispatch from the Actions UI
#
# CGO + PKCS#11 means each OS needs its own native runner — these can't be
# cross-compiled cleanly.

on:
  push:
    branches: [main, dsc_bridge, workspace/*]
    tags: ["v*"]
    paths:
      - "dsc_bridge/**"
      - ".github/workflows/build-bridge.yml"
  pull_request:
    paths:
      - "dsc_bridge/**"
      - ".github/workflows/build-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to upload Release assets when a tag is pushed

defaults:
  run:
    working-directory: dsc_bridge

jobs:
  # ─── Linux x64 ────────────────────────────────────────────────────────────
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: |
          go mod tidy
          CGO_ENABLED=1 go build -ldflags "-s -w" -o build/dsc-bridge .
      - uses: actions/upload-artifact@v4
        with:
          name: dsc-bridge-linux-amd64
          path: dsc_bridge/build/dsc-bridge

  # ─── Windows x64 + x86 (cross-compiled from Linux with mingw) ──────────────
  # Built on Linux because GitHub's windows-latest runner ships only the 64-bit
  # mingw toolchain, which cannot produce 32-bit (386) CGO binaries (it fails
  # with "cannot find -lmingw32"). The mingw cross-compilers on Ubuntu build both
  # architectures reliably — the same way dsc_bridge/build.sh does locally.
  windows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install MinGW cross-compilers
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Build (${{ matrix.arch }})
        run: |
          go mod tidy
          if [ "${{ matrix.arch }}" = "386" ]; then
            OUT="build/dsc-bridge-x86.exe"; CC=i686-w64-mingw32-gcc
          else
            OUT="build/dsc-bridge.exe"; CC=x86_64-w64-mingw32-gcc
          fi
          GOOS=windows GOARCH=${{ matrix.arch }} CGO_ENABLED=1 CC="$CC" \
            go build -ldflags "-s -w -H windowsgui" -o "$OUT" .
      - uses: actions/upload-artifact@v4
        with:
          name: dsc-bridge-windows-${{ matrix.arch }}
          path: dsc_bridge/build/dsc-bridge*.exe

  # ─── macOS Intel + Apple Silicon + Universal ──────────────────────────────
  macos:
    runs-on: macos-14   # Apple Silicon runner; can build amd64 too via cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build darwin/amd64
        run: |
          go mod tidy
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 \
            go build -ldflags "-s -w" -o build/dsc-bridge-darwin-amd64 .
      - name: Build darwin/arm64
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 \
            go build -ldflags "-s -w" -o build/dsc-bridge-darwin-arm64 .
      - name: lipo into universal binary
        run: |
          lipo -create \
            -output build/dsc-bridge-darwin-universal \
            build/dsc-bridge-darwin-amd64 \
            build/dsc-bridge-darwin-arm64
          file build/dsc-bridge-darwin-universal
      - name: Build macOS installer (.pkg)
        run: |
          chmod +x build.sh
          ./build.sh darwin-pkg
          pkgutil --payload-files build/dsc-bridge-1.0.0.pkg | head
      - name: Smoke-test the .pkg (install, bridge answers on 127.0.0.1:4645)
        run: |
          echo "console user: $(stat -f %Su /dev/console)"
          # Simulate leftovers from an older .pkg that ran as root: a root-owned data dir.
          D="$HOME/Library/Application Support/dsc-bridge"
          sudo mkdir -p "$D" && sudo sh -c "echo stale > '$D/tls_cert.pem'; echo stale > '$D/tls_key.pem'" && sudo chmod -R go-rwx "$D" && sudo chown -R root "$D"
          sudo installer -pkg build/dsc-bridge-1.0.0.pkg -target /
          ok=""
          for i in $(seq 1 15); do
            if curl -s --max-time 3 https://127.0.0.1:4645/v1/status; then ok=1; break; fi
            sleep 2
          done
          echo
          CERT="$HOME/Library/Application Support/dsc-bridge/tls_cert.pem"
          [ -f "$CERT" ] && openssl x509 -in "$CERT" -noout -startdate -enddate
          cat /tmp/dsc-bridge.err.log /tmp/dsc-bridge.log 2>/dev/null | tail -40 || true
          tail -40 "$HOME/Library/Application Support/dsc-bridge/bridge.log" 2>/dev/null || true
          launchctl print "gui/$(id -u)/com.esign.dsc-bridge" 2>/dev/null | head -20 || true
          [ -n "$ok" ] || { echo "bridge did not answer over trusted HTTPS"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dsc-bridge-macos
          path: |
            dsc_bridge/build/dsc-bridge-darwin-amd64
            dsc_bridge/build/dsc-bridge-darwin-arm64
            dsc_bridge/build/dsc-bridge-darwin-universal
            dsc_bridge/build/dsc-bridge-1.0.0.pkg

  # ─── Release (only on tag push) ───────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-amd64, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten & rename
        run: |
          mkdir -p release
          cp artifacts/dsc-bridge-linux-amd64/dsc-bridge       release/dsc-bridge-linux-amd64
          cp artifacts/dsc-bridge-windows-amd64/dsc-bridge.exe release/dsc-bridge-windows-amd64.exe
          cp artifacts/dsc-bridge-windows-386/dsc-bridge-x86.exe release/dsc-bridge-windows-386.exe
          cp artifacts/dsc-bridge-macos/dsc-bridge-darwin-amd64    release/
          cp artifacts/dsc-bridge-macos/dsc-bridge-darwin-arm64    release/
          cp artifacts/dsc-bridge-macos/dsc-bridge-darwin-universal release/
          cp artifacts/dsc-bridge-macos/dsc-bridge-1.0.0.pkg release/
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
